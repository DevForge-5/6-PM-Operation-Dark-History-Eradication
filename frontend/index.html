<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090b08">
    <title>6PM : 흑역사 소멸작전</title>
    <link rel="icon" type="image/png" href="./assets/images/IntroTitleLogo.png">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link rel="stylesheet" href="./css/scenes.css">
    <link rel="stylesheet" href="./css/animations.css">
  </head>
  <body>
    <div id="scene-root" class="scene-root"></div>

    <template id="exploration-scene-template">
      <main class="game-shell" aria-label="6PM 이동 테스트">
        <section class="game-stage" aria-label="게임 화면">
          <canvas
            id="game-canvas"
            width="1024"
            height="576"
            tabindex="0"
            aria-label="주인공 이동 화면. 키보드에서는 WASD 또는 방향키를 사용하세요."
          ></canvas>

          <div id="principal-danger-overlay" class="principal-danger-overlay" aria-hidden="true"></div>
          <div id="damage-flash-overlay" class="damage-flash-overlay" aria-hidden="true"></div>

          <div id="hazard-warning-overlay" class="hazard-warning-overlay" role="alert" hidden>
            <svg class="hazard-warning-overlay__icon" viewBox="0 0 100 90" aria-hidden="true">
              <path
                d="M50 6 L94 82 L6 82 Z"
                fill="none"
                stroke="currentColor"
                stroke-width="10"
                stroke-linejoin="round"
                stroke-linecap="round"
              />
              <path
                d="M50 32 C55 32 58 35 57.5 40 L54 60 C53.6 63 46.4 63 46 60 L42.5 40 C42 35 45 32 50 32 Z"
                fill="currentColor"
              />
              <circle cx="50" cy="70" r="5.5" fill="currentColor" />
            </svg>
            <p class="hazard-warning-overlay__text">장애물 주의</p>
          </div>

          <!-- Siren boss fight status: pip count matches musicRoom.fight.sirenHp -->
          <section id="siren-boss-hud" class="siren-boss-hud" aria-label="세이렌 보스전 상태" hidden>
            <p class="siren-boss-hud__round">ROUND 1 / 6</p>
            <div class="siren-boss-hud__hp" role="img" aria-label="세이렌 남은 체력">
              <span class="siren-boss-hud__pip"></span>
              <span class="siren-boss-hud__pip"></span>
              <span class="siren-boss-hud__pip"></span>
            </div>
          </section>
          <p id="siren-boss-prompt" class="siren-boss-prompt" role="status"></p>

          <div class="mobile-controls" aria-label="모바일 이동 조작">
            <button class="direction-button direction-button--up" type="button" data-direction="up" aria-label="위로 이동">▲</button>
            <button class="direction-button direction-button--left" type="button" data-direction="left" aria-label="왼쪽으로 이동">◀</button>
            <button class="direction-button direction-button--down" type="button" data-direction="down" aria-label="아래로 이동">▼</button>
            <button class="direction-button direction-button--right" type="button" data-direction="right" aria-label="오른쪽으로 이동">▶</button>
          </div>

          <button id="mobile-pause-button" class="mobile-pause-button" type="button" aria-label="게임 일시정지">Ⅱ</button>

          <div id="loading-message" class="screen-message" role="status" aria-live="polite">
            <p>작전 구역 불러오는 중…</p>
          </div>

          <div id="asset-error" class="screen-message screen-message--error" role="alert" hidden>
            <p>게임 자산을 불러오지 못했습니다.</p>
            <p>페이지를 새로고침해 주세요.</p>
          </div>

          <section id="pause-overlay" class="pause-overlay" aria-label="일시 정지" hidden>
            <label class="pause-overlay__title">
              <input id="force-pause-checkbox" type="checkbox">
              <span class="pause-overlay__checkbox" aria-hidden="true"></span>
              <span>멈추기</span>
            </label>
            <div class="pause-overlay__actions">
              <button id="resume-button" class="pause-overlay__action" type="button" data-sound="resume_game">
                <span aria-hidden="true">▶</span> 재개
              </button>
              <button id="home-button" class="pause-overlay__action" type="button" data-sound="go_home">
                <span aria-hidden="true">⌂</span> 홈으로
              </button>
            </div>
            <button id="sound-toggle-button" class="pause-overlay__sound" type="button" aria-label="사운드 끄기" aria-pressed="false">
              <img id="sound-toggle-icon" src="./assets/images/PausedIMG/speaker%201.png" alt="">
            </button>
            <button id="pause-option-button" class="pause-overlay__option" type="button" data-sound="option_open" aria-label="설정 열기">⚙</button>
          </section>

          <section id="death-overlay" class="death-overlay" aria-label="게임 오버" hidden>
            <div class="death-overlay__panel">
              <p class="death-overlay__eyebrow">MISSION FAILED</p>
              <h2 class="death-overlay__title">GAME OVER</h2>
              <p class="death-overlay__message">흑역사를 막지 못했습니다.</p>
              <div class="death-overlay__actions">
                <button id="death-restart-button" class="death-overlay__button" type="button">다시 시작</button>
                <button id="death-home-button" class="death-overlay__button" type="button">메인 메뉴</button>
              </div>
            </div>
          </section>
        </section>
      </main>
    </template>

    <aside class="rotate-notice" role="status" aria-label="화면 회전 안내">
      <span class="rotate-notice__icon" aria-hidden="true">↻</span>
      <p>휴대폰을 가로로 돌려 주세요.</p>
    </aside>

    <script>
      window.SIXPM_API_BASE_URL = "https://sixpm-backend.onrender.com";
    </script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
