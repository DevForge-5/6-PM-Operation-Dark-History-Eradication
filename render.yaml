databases:
  - name: sixpm-db
    plan: free
    databaseName: sixpm
    user: sixpm

services:
  - type: web
    name: sixpm-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/rankings/ending1
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: sixpm-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sixpm-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: sixpm-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: sixpm-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sixpm-db
          property: password
      # 프론트 배포 도메인 확정 후 Render 대시보드에서 직접 채우기 (예: https://sixpm.vercel.app)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
